services:
  postgres:
    image: postgres:16-alpine
    container_name: signout-postgres
    environment:
      POSTGRES_USER: signout
      POSTGRES_PASSWORD: signout
      POSTGRES_DB: signout
    ports:
      - "5432:5432"
    volumes:
      - signout_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signout -d signout"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  signout_pg_data:
